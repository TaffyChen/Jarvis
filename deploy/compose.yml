# 服务器 / 一体部署：Jarvis 应用 + MySQL + Milvus
# 用法（仓库根目录）：
#   docker compose --env-file .env -f deploy/compose.yml up -d --build

name: jarvis

include:
  - path: mysql/compose.yml
  - path: milvus/compose.yml

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: jarvis:local
    container_name: jarvis-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DATA_DIR: /srv/data
      KNOWLEDGE_DIR: /srv/knowledge
      MILVUS_URI: http://standalone:19530
    ports:
      - "${JARVIS_PORT:-1690}:1690"
    volumes:
      - jarvis-app-data:/srv/data
      - ../knowledge:/srv/knowledge
    depends_on:
      mysql:
        condition: service_healthy
      standalone:
        condition: service_healthy

volumes:
  jarvis-app-data:
