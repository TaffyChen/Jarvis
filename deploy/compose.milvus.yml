# 叠加在 compose.yml 上，启用 Milvus 向量库
# docker compose --env-file .env -f deploy/compose.yml -f deploy/compose.milvus.yml up -d --build

include:
  - path: milvus/compose.yml

services:
  app:
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://standalone:19530
    depends_on:
      standalone:
        condition: service_healthy
